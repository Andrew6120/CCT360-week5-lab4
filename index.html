<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>McDonald's Order</title>
</head>

<body>

	<h1>McDonald's Order Menu</h1>


	<h2>
		<input type="checkbox" id="bigMac">
		<label for="bigMac">Big Mac</label>
	</h2>

	<input type="checkbox" id="cheese">
	<label for="cheese">Add Cheese</label>

	<br>

	<input type="checkbox" id="tomato">
	<label for="tomato">Add Tomato</label>


	<h2>
		<input type="checkbox" id="fries">
		<label for="fries">Fries</label>
	</h2>

	<input type="checkbox" id="salt">
	<label for="salt">Add Salt</label>


	<br><br>

	<button onclick="makeOrder()">Place Order</button>


	<h2>Your Order:</h2>

	<p id="orderResult">
		Select your food above.
	</p>



</body>
</html>
